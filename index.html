<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .weather-card { 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            background: white; 
            max-width: 500px;
            margin: auto;
        }
        .temp-display { font-size: 3.5rem; font-weight: bold; color: #0d6efd; }
        .forecast-box { background-color: #e9ecef; border-radius: 10px; padding: 15px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="weather-card p-4 text-center">
                    <h2 class="mb-4">{{ city_name if city_name else "Hyderabad" }} Weather AI</h2>
                    
                    <form action="/" method="get" class="mb-4">
                        <div class="input-group">
                            <input type="text" name="city" class="form-control" placeholder="Enter city name..." required>
                            <button class="btn btn-primary" type="submit">Check Weather</button>
                        </div>
                    </form>
                    
                    <hr>
                    
                    <p class="text-muted mb-0">Current Temperature</p>
                    <div class="temp-display">{{ live_temp }}°C</div>
                    
                    <div class="forecast-box mt-4">
                        <h5>AI Tomorrow Forecast</h5>
                        <p class="h3 text-success mb-0">{{ forecast }}°C</p>
                    </div>

                    <div class="mt-4 gap-2 d-grid">
                        <a href="/graph" target="_blank" class="btn btn-outline-secondary">View Prediction Trend Graph</a>
                        <button onclick="location.reload()" class="btn btn-outline-primary">Refresh Data</button>
                    </div>
                </div>
                <p class="mt-3 text-center text-muted small">Powered by FastAPI, OpenWeatherMap, and Scikit-Learn</p>
            </div>
        </div>
    </div>
</body>
</html>
